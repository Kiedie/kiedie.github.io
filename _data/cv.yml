    Professional Summary:
      - PhD candidate in Computer Science at the University of Granada, specialising in **zero-shot learning** and semantic-space preprocessing. My research experience encompasses machine learning, deep learning, generative artificial intelligence, and quantum machine learning, supported by a strong interdisciplinary background in mathematics and computer science. I have also conducted research at BBVA and as a visiting PhD student at the University of Nottingham.

